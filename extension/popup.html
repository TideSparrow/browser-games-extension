<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Game Hub – Game Finder</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon-48.png" width="30" height="30" alt="">
        <span>Browser Game <strong>Hub</strong></span>
      </div>
      <div class="topbar-actions">
        <a id="website" class="website" target="_blank" rel="noopener noreferrer">
          <span data-message="website"></span><span aria-hidden="true">↗</span>
        </a>
        <label for="language" class="visually-hidden" data-message="languageLabel"></label>
        <select id="language" class="language">
          <option value="" data-message="languageAuto"></option>
          <option value="en" lang="en">English</option>
          <option value="zh_CN" lang="zh-CN">简体中文</option>
          <option value="zh_TW" lang="zh-TW">繁體中文</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="ko" lang="ko">한국어</option>
          <option value="es" lang="es">Español</option>
          <option value="pt_BR" lang="pt-BR">Português (BR)</option>
          <option value="fr" lang="fr">Français</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="ru" lang="ru">Русский</option>
          <option value="id" lang="id">Indonesia</option>
          <option value="vi" lang="vi">Tiếng Việt</option>
        </select>
      </div>
    </header>
    <main>
      <section class="picker">
        <div class="picker-copy">
          <h1 data-message="title"></h1>
          <p class="hint" data-message="rollHint"></p>
        </div>
        <button class="roll" id="roll" type="button" aria-haspopup="dialog" aria-controls="dice-draw">
          <span class="die" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span data-message="roll"></span>
        </button>
      </section>

      <div class="filters">
        <label for="search" class="visually-hidden" data-message="searchLabel"></label>
        <input id="search" type="search" autocomplete="off" spellcheck="false">
        <div class="filter-row">
          <label for="category" class="visually-hidden" data-message="categoryLabel"></label>
          <select id="category"><option value="" data-message="allCategories"></option></select>
          <button class="favorites" id="favorites" type="button" aria-pressed="false">
            <span aria-hidden="true">★</span><span data-message="favorites"></span>
          </button>
        </div>
      </div>
      <p class="count" id="count"></p>
      <p class="empty" id="empty" hidden></p>
      <ul class="games" id="games"></ul>
      <button class="more" id="more" type="button" aria-controls="games" hidden data-message="showMore"></button>
    </main>

    <dialog class="dice-draw" id="dice-draw" aria-labelledby="dice-title">
      <div class="dice-inner">
        <div class="dice-toolbar">
          <button class="dice-control dice-sound" id="dice-sound" type="button" aria-pressed="true">
            <span data-message="diceSound"></span>
          </button>
          <form method="dialog">
            <button class="dice-control dice-close" autofocus>
              <span aria-hidden="true">×</span><span class="visually-hidden" data-message="diceClose"></span>
            </button>
          </form>
        </div>
        <h2 id="dice-title" data-message="diceTitle"></h2>
        <div class="dice-stage" aria-hidden="true">
          <div class="dice-orbit" id="dice-orbit">
            <div class="dice-camera">
              <div class="dice-cube" id="dice-cube">
                <div class="dice-face" data-pips="⚀"></div>
                <div class="dice-face" data-pips="⚁"></div>
                <div class="dice-face" data-pips="⚂"></div>
                <div class="dice-face" data-pips="⚃"></div>
                <div class="dice-face" data-pips="⚄"></div>
                <div class="dice-face" data-pips="⚅"></div>
              </div>
            </div>
          </div>
        </div>
        <p class="dice-result" id="dice-result" role="status" dir="auto"></p>
        <div class="dice-actions">
          <a class="dice-control dice-play" id="dice-play" target="_blank" rel="noopener noreferrer">
            <span data-message="play"></span><span aria-hidden="true">↗</span>
          </a>
          <button class="dice-control" id="dice-reroll" type="button" data-message="diceAgain"></button>
        </div>
        <button class="dice-countdown" id="dice-countdown" type="button"></button>
      </div>
    </dialog>

    <template id="game-row">
      <li class="game-row">
        <a class="game-link" target="_blank" rel="noopener noreferrer">
          <span class="category-mark" aria-hidden="true"></span>
          <span class="game-text"><strong class="game-title" dir="auto"></strong><span class="game-category"></span></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <button class="star" type="button" aria-pressed="false"><span aria-hidden="true">★</span></button>
      </li>
    </template>
  </body>
</html>
