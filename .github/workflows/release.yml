name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - run: npm run package
      - run: unzip -tq dist/browser-games-extension.zip
      - run: unzip -tq dist/browser-games-extension-firefox.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-games-extension
          path: dist/browser-games-extension*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-games-extension
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(unzip -p browser-games-extension.zip manifest.json | jq -r '.version')
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(unzip -p browser-games-extension-firefox.zip manifest.json | jq -r '.version')" = "$version"
          gh release create "$GITHUB_REF_NAME" browser-games-extension.zip browser-games-extension-firefox.zip --verify-tag --title "Browser Game Hub – Game Finder $GITHUB_REF_NAME" --generate-notes
